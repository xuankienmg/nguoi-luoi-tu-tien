name: Build & Release Game

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to release (e.g. v0.7.5)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vandao-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: Supbase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate release tag and configuration
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Version must be an existing vX.Y.Z tag.' }
          $version = $Matches[1]
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
          if (!$env:SUPABASE_URL -or !$env:SUPABASE_KEY) { throw 'Missing Supabase release secrets.' }
          "TAG=$env:RELEASE_TAG" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build release notes
        shell: pwsh
        env:
          UPCOMING_NOTES: docs/releases/upcoming.md
        run: |
          # tag trước đó (bỏ qua tag hiện tại), không có thì lấy toàn bộ lịch sử
          $prev = git describe --tags --abbrev=0 --match 'v[0-9]*' "$env:TAG^" 2>$null
          # ưu tiên release note viết tay trong upcoming.md (tại commit của tag); trống thì sinh từ commit
          $upcoming = if (Test-Path $env:UPCOMING_NOTES) { (Get-Content -Raw -Encoding utf8 $env:UPCOMING_NOTES).Trim() } else { '' }
          if ($upcoming) {
            $md = @($upcoming, '')
            "NOTES_SOURCE=upcoming" >> $env:GITHUB_ENV
          } else {
            $range = if ($prev) { "$prev..$env:TAG" } else { $env:TAG }
            $groups = [ordered]@{ 'Tính năng mới' = @(); 'Sửa lỗi' = @(); 'Cân bằng & cải thiện' = @(); 'Khác' = @() }
            foreach ($l in (git log $range --no-merges --pretty=format:'%s')) {
              if     ($l -match '^feat(\(.+?\))?!?:\s*(.+)')                     { $groups['Tính năng mới'] += $Matches[2] }
              elseif ($l -match '^fix(\(.+?\))?!?:\s*(.+)')                      { $groups['Sửa lỗi'] += $Matches[2] }
              elseif ($l -match '^(perf|refactor|balance)(\(.+?\))?!?:\s*(.+)')  { $groups['Cân bằng & cải thiện'] += $Matches[3] }
              elseif ($l -notmatch '^(chore|ci|docs|test|build)(\(.+?\))?:')     { $groups['Khác'] += $l }
            }
            $md = @("## Có gì mới trong $env:TAG", '')
            foreach ($k in $groups.Keys) {
              if ($groups[$k].Count) { $md += "### $k"; $md += $groups[$k] | ForEach-Object { "- $_" }; $md += '' }
            }
            "NOTES_SOURCE=commits" >> $env:GITHUB_ENV
          }
          if ($prev) { $md += "So sánh: https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$env:TAG" }
          $md | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md >> $env:GITHUB_STEP_SUMMARY

      - name: Build and package self-contained game and Launcher
        shell: pwsh
        run: |
          $credentialPattern = '(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})'
          $sourceFiles = Get-ChildItem NguoiLuoiTuTienLauncher -Recurse -File -Include *.cs,*.js,*.html,*.json | Where-Object { $_.FullName -notmatch '[\\/](bin|obj|publish)[\\/]' -and $_.Name -ne 'launcher_settings.json' }
          foreach ($sourceFile in $sourceFiles) {
            if ([IO.File]::ReadAllText($sourceFile.FullName) -match $credentialPattern) { throw "GitHub credential found in Launcher source: $($sourceFile.Name)" }
          }
          $stageRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          $gameDir = Join-Path $stageRoot 'game'
          $launcherDir = Join-Path $stageRoot 'launcher'
          dotnet publish VanDao.csproj -c Release -r win-x64 -o $gameDir --self-contained true -p:VersionFromTag=false -p:Version=$env:VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw 'Game publish failed.' }
          dotnet publish NguoiLuoiTuTienLauncher/NguoiLuoiTuTienLauncher.csproj -c Release -r win-x64 -o $launcherDir --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw 'Launcher publish failed.' }
          # Package only runtime output; stage outside the source tree to avoid nested publish files.
          foreach ($dir in @($gameDir, $launcherDir)) {
            Get-ChildItem -LiteralPath $dir -File | Where-Object Extension -in '.pdb', '.xml' | Remove-Item -Force
          }
          Copy-Item (Join-Path $launcherDir 'NguoiLuoiTuTienLauncher.exe') $gameDir -Force
          $launcherUi = Join-Path $gameDir 'NguoiLuoiTuTienLauncher'
          New-Item -ItemType Directory -Path $launcherUi -Force | Out-Null
          Copy-Item NguoiLuoiTuTienLauncher/wwwroot $launcherUi -Recurse -Force
          if (Get-ChildItem $gameDir -Recurse -File -Filter launcher_settings.json) { throw 'Local Launcher settings must not be packaged.' }
          $zipPath = Join-Path $env:RUNNER_TEMP "VanDao_$env:TAG.zip"
          Compress-Archive -Path "$gameDir/*" -DestinationPath $zipPath -Force
          "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          files: ${{ env.ZIP_PATH }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body_path: release-notes.md
          # release note viết tay đã đủ, chỉ nối danh sách PR tự sinh khi dùng note từ commit
          generate_release_notes: ${{ env.NOTES_SOURCE != 'upcoming' }}

      - name: Verify uploaded ZIP and update Supabase
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify GitHub release.' }
          $release = $releaseJson | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { $_.name -eq "VanDao_$env:TAG.zip" -and $_.state -eq 'uploaded' })
          if ($asset.Count -ne 1 -or $asset[0].size -le 0 -or $release.draft) { throw 'Release ZIP is not ready.' }
          $headers = @{ apikey = $env:SUPABASE_KEY; Authorization = "Bearer $env:SUPABASE_KEY"; Prefer = 'return=representation' }
          $endpoint = "$($env:SUPABASE_URL.TrimEnd('/'))/rest/v1/app_config?id=eq.1"
          $current = @(Invoke-RestMethod -Uri $endpoint -Headers $headers)
          if ($current.Count -ne 1) { throw 'Expected app_config row id=1.' }
          if ([version]$current[0].latest_version.TrimStart('v', 'V') -gt [version]$env:VERSION) { throw 'Refusing to announce an older version over a newer release.' }
          $message = git tag -l --format='%(contents:subject)' $env:TAG
          $body = @{ latest_version = $env:VERSION; download_url = $asset[0].browser_download_url; message = "$message" } | ConvertTo-Json -Compress
          $updated = @(Invoke-RestMethod -Method Patch -Uri $endpoint -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body)))
          if ($updated.Count -ne 1 -or $updated[0].latest_version -ne $env:VERSION -or $updated[0].download_url -ne $asset[0].browser_download_url) { throw 'Supabase release update was not confirmed.' }
          "### Published $env:TAG and synchronized app_config (min_version unchanged)" >> $env:GITHUB_STEP_SUMMARY

  deploy-server:
    needs: build-and-release
    uses: ./.github/workflows/deploy-server.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
