name: Deploy Oracle Server

# Deploy backend online lên VM Oracle Cloud Always Free đúng commit của một tag phát hành (tools/online_cloud/ORACLE.md).
# Chạy song song với Render (deploy-server.yml) trong giai đoạn thử; thiếu secret ORACLE_* thì bỏ qua, không làm hỏng bản phát hành.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      migrations_applied:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to deploy (e.g. v0.15.2)'
        required: true
        type: string
      migrations_applied:
        description: 'Đã áp migration mới của tag này lên Supabase cloud'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vandao-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Supbase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.version }}

      - name: Check tag, secrets and migrations
        id: check
        shell: bash
        env:
          TAG: ${{ inputs.version }}
          MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be a vX.Y.Z tag."; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}") || { echo "::error::Tag $TAG does not exist."; exit 1; }
          git merge-base --is-ancestor "$sha" origin/master || { echo "::error::$TAG is not on master."; exit 1; }
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "### Bỏ qua deploy Oracle: chưa có đủ secret ORACLE_HOST / ORACLE_SSH_KEY / ORACLE_KNOWN_HOSTS" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          # schema phải có trên Supabase cloud trước khi backend mới chạy (tools/online_cloud/README.md mục 2)
          if [ "$MIGRATIONS_APPLIED" != "true" ] && { [ -z "$prev" ] || ! git diff --quiet "$prev" "$sha" -- Online/Migrations supabase/migrations; }; then
            echo "### Chưa deploy Oracle: $TAG có migration mới so với ${prev:-lịch sử đầu}. Áp migration rồi chạy tay workflow với *migrations_applied*." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$TAG has new online migrations; Oracle deploy skipped until they are applied."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Package backend source
        if: steps.check.outputs.deploy == 'true'
        shell: bash
        env:
          SHA: ${{ steps.check.outputs.sha }}
        run: |
          # chỉ những gì Dockerfile.online cần + script deploy; VM không cần quyền đọc repo
          git archive --format=tar.gz -o src.tgz "$SHA" -- \
            Dockerfile.online .dockerignore Program.cs Game Data Online Desktop/AppPaths.cs wwwroot tools/online_host deploy/oracle
          ls -lh src.tgz

      - name: Upload and deploy on VM
        if: steps.check.outputs.deploy == 'true'
        shell: bash
        env:
          TAG: ${{ inputs.version }}
          HOST: ${{ secrets.ORACLE_HOST }}
          USER_NAME: ${{ vars.ORACLE_USER || 'ubuntu' }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/oracle -o StrictHostKeyChecking=yes -o ServerAliveInterval=30)
          target="$USER_NAME@$HOST"
          scp "${ssh_opts[@]}" src.tgz "$target:/opt/vandao/releases/$TAG.tgz"
          ssh "${ssh_opts[@]}" "$target" bash -s -- "$TAG" <<'REMOTE'
          set -euo pipefail
          TAG="$1"; dir="/opt/vandao/releases/$TAG"
          rm -rf "$dir" && mkdir -p "$dir"
          tar -xzf "$dir.tgz" -C "$dir" && rm -f "$dir.tgz"
          bash "$dir/deploy/oracle/deploy.sh" "$TAG"
          REMOTE
          echo "### Đã deploy $TAG lên Oracle ($HOST)" >> "$GITHUB_STEP_SUMMARY"

      - name: Public health check
        if: steps.check.outputs.deploy == 'true' && vars.ORACLE_PUBLIC_URL != ''
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.ORACLE_PUBLIC_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -m 20 "$PUBLIC_URL/healthz" | grep -q '"ok"'; then
              echo "Health check OK: $PUBLIC_URL/healthz" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "::error::$PUBLIC_URL/healthz did not report ok (kiểm tra DNS, cổng 80/443, log Caddy)."; exit 1
