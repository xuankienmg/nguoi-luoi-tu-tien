<html lang="vi">
<head>
  <link rel="icon" type="image/x-icon" href="/img/app/icon.ico">
  <link rel="apple-touch-icon" href="/img/app/icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người Lười Tu Tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/inventory.css">
<link rel="stylesheet" href="css/craft.css">
<link rel="stylesheet" href="css/spin.css">
<link rel="stylesheet" href="css/breakthrough.css">
<link rel="stylesheet" href="css/skills.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/leaderboard.css">
<link rel="stylesheet" href="css/arena.css">
<link rel="stylesheet" href="css/market.css">
<link rel="stylesheet" href="css/version.css">
<link rel="stylesheet" href="css/bag-warn.css">
<link rel="stylesheet" href="css/menu-background.css">
<link rel="stylesheet" href="css/concept-shell.css">
<link rel="stylesheet" href="css/pet.css">
</head>
<body>

<div class="wrap">
  <main class="grid">
    <section class="altar">
      <div class="stage-wrap">
        <canvas id="stage" aria-label="Thám hiểm diệt yêu"></canvas>
        <div class="hud">
          <div class="realm" id="hudRealm">Luyện Khí</div>
          <div class="sub"><b id="hudStage">Tầng 1</b> · <span id="hudRate">2 tu vi/giây</span></div>
        </div>
      </div>
      <div class="strip-head">
        <b id="sRealm">Luyện Khí</b><span class="st" id="sStage">Tầng 1</span>
        <button class="ib sm" id="btnEvent" aria-label="Sự kiện Thiên Cơ" data-tip="Sự kiện Thiên Cơ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v10H4z"/><path d="M3 7h18v3H3zM12 7v13"/><path d="M12 7c-1.5-3-5-3.5-5-1.2C7 7 9.5 7 12 7zm0 0c1.5-3 5-3.5 5-1.2C17 7 14.5 7 12 7z"/></svg></button>
        <button class="ib sm" id="btnRank" aria-label="Bảng xếp hạng" data-tip="Bảng xếp hạng&#10;Lực chiến và cảnh giới"><svg width="18" height="18" viewBox="0 0 64 64" aria-hidden="true" style="vertical-align:middle;margin-right:4px"><path d="M15 10h34v44H15zM11 15h42M11 49h42M23 40V30h6v10m5 0V23h6v17M20 44h24" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
        <button class="ib sm" id="btnMenu" aria-label="Cài đặt" data-tip="Cài đặt&#10;Bố cục, kích thước, ghim, ngôn ngữ"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <div class="qi">
        <div class="qi-head"><span id="qiLabel">Tu vi</span><span id="qiText">0 / 60</span></div>
        <div class="bar" id="qiBar"><i></i><span class="bar-txt" id="qiBarTxt"></span></div>
      </div>
      <div class="actions">
        <button class="ib" id="btnBag" aria-label="Hành trang" data-tip="Hành trang&#10;Trang bị, chỉ số và vật phẩm"><img class="mi" src="img/ui_hanh_trang.png" alt=""></button>
        <button class="ib" id="btnPanel" aria-label="Bản đồ" data-tip="Bản đồ&#10;Chọn ải diệt yêu · khu vực Boss"><img class="mi" src="img/ui_ban_do.png" alt=""></button>
        <button class="ib gold" id="btnAdvance" aria-label="Đột phá" data-tip="Đột phá"><img class="mi" src="img/ui_dot_pha.png" alt=""></button>

        <button class="ib next" id="btnNext" aria-label="Ải tiếp theo" data-tip="Ải tiếp theo"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg></button>
        <div class="trip walk" id="trip"><div class="trip-bar"><i></i></div><span id="tripText">Thám hiểm</span></div>
        <button class="ib boss" id="btnBoss" aria-label="Khiêu chiến Boss" data-tip="Khiêu chiến Boss" style="display:none"><svg class="bh" viewBox="0 0 24 24" aria-hidden="true">
          <defs><radialGradient id="bhHalo"><stop offset=".25" stop-color="#ff3a20" stop-opacity=".9"/><stop offset=".55" stop-color="#b0120a" stop-opacity=".45"/><stop offset="1" stop-color="#400" stop-opacity="0"/></radialGradient>
            <linearGradient id="bhArm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd09a"/><stop offset=".45" stop-color="#ff4a2a"/><stop offset="1" stop-color="#6a0800" stop-opacity="0"/></linearGradient></defs>
          <circle class="bh-halo" cx="12" cy="12" r="11.5" fill="url(#bhHalo)"/>
          <g class="bh-arms" fill="none" stroke="url(#bhArm)" stroke-linecap="round"><path d="M12 8.2c3.6-.4 6.6 1.8 7.4 5" stroke-width="1.6"/><path d="M15.8 12c.4 3.6-1.8 6.6-5 7.4" stroke-width="1.6"/><path d="M12 15.8c-3.6.4-6.6-1.8-7.4-5" stroke-width="1.6"/><path d="M8.2 12c-.4-3.6 1.8-6.6 5-7.4" stroke-width="1.6"/>
            <path d="M12 6.4c4.6.2 7.6 3.4 7.4 7.6" stroke-width=".7" opacity=".7"/><path d="M12 17.6c-4.6-.2-7.6-3.4-7.4-7.6" stroke-width=".7" opacity=".7"/></g>
          <ellipse class="bh-disk" cx="12" cy="12" rx="9" ry="2.4" fill="none" stroke="#ff7a3a" stroke-width=".9" opacity=".85" transform="rotate(-18 12 12)"/>
          <circle cx="12" cy="12" r="3.6" fill="#000" stroke="#ffb27a" stroke-width=".8"/>
          <circle cx="12" cy="12" r="2.6" fill="#000"/></svg></button>
      </div>
      <div class="tip" id="tip" role="tooltip" hidden></div>
      <div class="burst" id="burst" aria-live="assertive" hidden><b></b><small></small></div>
      <div class="craft-toast" id="craftToast" role="status" aria-live="polite" hidden></div>
      <div class="log" id="log" aria-live="polite"><h3>Nhật ký tu hành</h3></div>
    </section>

    <aside class="book">
      <div class="concept-header">
      <header class="game-brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m4 25 9-10 7 6 8-14 8 18M3 30h34M10 34h20"/><circle cx="29" cy="9" r="4"/></svg><b>Người Lười Tu Tiên</b><small>Tu luyện · Ngự thú · Vấn đạo</small></header>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-req" aria-selected="true" data-tab="req">Đột phá</button>
        <button class="tab" role="tab" id="tab-inv" aria-selected="false" data-tab="inv">Hành trang</button>
        <button class="tab" role="tab" id="tab-craft" aria-selected="false" data-tab="craft">Luyện  chế</button>
        <button class="tab" role="tab" id="tab-map" aria-selected="false" data-tab="map">Bản đồ</button>
        <button class="tab" role="tab" id="tab-skill" aria-selected="false" data-tab="skill">Công pháp</button>
        <button class="tab" role="tab" id="tab-pet" aria-selected="false" data-tab="pet">Linh thú</button>
        <button class="tab" role="tab" id="tab-market" aria-selected="false" data-tab="market">Chợ</button>
        <button class="tab adm" role="tab" id="tab-admin" aria-selected="false" data-tab="admin" hidden>Admin</button>
      </div>
      </div>
      <div class="concept-tools" aria-label="Linh thạch hiện tại">
        <div class="concept-wallet" title="Linh thạch hiện tại"><img src="img/stone/linh_thach.png" alt=""><span>Linh thạch</span><b class="concept-balance" id="navStones" aria-label="Linh thạch">—</b><button type="button" id="navMarket" aria-label="Mở Chợ" title="Mở Chợ">+</button></div>
        <div class="concept-wallet premium" title="Thượng phẩm linh thạch hiện tại"><img src="img/stone/thuong_pham_linh_thach.png" alt=""><span>Thượng phẩm</span><b class="concept-balance" id="navPremium" aria-label="Thượng phẩm linh thạch">—</b></div>
      </div>
      <div class="pane" id="pane-req"></div>
      <div class="pane" id="pane-inv" hidden></div>
      <div class="pane" id="pane-craft" hidden></div>
      <div class="pane" id="pane-fuse" hidden></div>
      <div class="pane" id="pane-sell" hidden></div>
      <div class="pane" id="pane-spin" hidden></div>
      <div class="pane" id="pane-map" hidden></div>
      <div class="pane" id="pane-skill" hidden></div>
      <div class="pane" id="pane-pet" hidden></div>
      <div class="pane" id="pane-market" hidden></div>
      <div class="pane" id="pane-rank" hidden></div>
      <div class="pane" id="pane-admin" hidden></div>
    </aside>
  </main>

</div>

<script src="js/i18n-en.js"></script>

<script src="js/leaderboard.js"></script>
