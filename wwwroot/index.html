<!doctype html>
<html lang="vi">
<head>
  <link rel="icon" type="image/x-icon" href="/img/app/icon.ico">
  <link rel="apple-touch-icon" href="/img/app/icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người Lười Tu Tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/inventory.css">
<link rel="stylesheet" href="css/craft.css">
<link rel="stylesheet" href="css/kyduyen.css">
<link rel="stylesheet" href="css/spin.css">
<link rel="stylesheet" href="css/breakthrough.css">
<link rel="stylesheet" href="css/skills.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/leaderboard.css">
<link rel="stylesheet" href="css/arena.css">
<link rel="stylesheet" href="css/market.css">
<link rel="stylesheet" href="css/version.css">
<link rel="stylesheet" href="css/bag-warn.css">
<link rel="stylesheet" href="css/menu-background.css">
<link rel="stylesheet" href="css/concept-shell.css">
<link rel="stylesheet" href="css/pet.css">
<link rel="stylesheet" href="css/vault.css">
<link rel="stylesheet" href="css/starter.css">
<link rel="stylesheet" href="css/events.css">
<link rel="stylesheet" href="css/power-tips.css">
<link rel="stylesheet" href="css/inventory-v2.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/newbie-quest.css">
<link rel="stylesheet" href="css/swarm.css">
</head>
<body>

<div class="wrap">
  <main class="grid">
    <section class="altar">
      <div class="stage-wrap">
        <canvas id="stage" aria-label="Thám hiểm diệt yêu"></canvas>
        <div class="hud">
          <div class="realm" id="hudRealm">Luyện Khí</div>
          <div class="sub"><b id="hudStage">Tầng 1</b> · <span id="hudRate">2 tu vi/giây</span></div>
          <div class="elx" id="hudElem" hidden>Nhãn hệ: <span class="up">khắc chế +20%</span> · <span class="dn">bị khắc −20%</span></div>
        </div>
        <div class="log" id="log">
          <div class="log-tabs" role="tablist" aria-label="Nhật ký và chat">
            <button type="button" class="log-tab" role="tab" id="logTabChat" aria-selected="false" aria-controls="chatPane" hidden>Thế giới <span class="chat-badge" id="chatTabBadge" hidden></span></button>
            <button type="button" class="log-tab" role="tab" id="logTabLog" aria-selected="true" aria-controls="logList">Nhật ký tu hành</button>
            <span class="chat-online" id="chatOnline" hidden></span>
          </div>
          <div class="log-list" id="logList" role="tabpanel" aria-labelledby="logTabLog" aria-live="polite"></div>
          <div class="chat-pane" id="chatPane" role="tabpanel" aria-labelledby="logTabChat" hidden>
            <div class="chat-msgs" id="chatMsgs" aria-live="polite"></div>
            <div class="chat-bar" id="chatBar" hidden></div>
            <form class="chat-form" id="chatForm" autocomplete="off">
              <label class="chat-sr" for="chatInput">Nhắn kênh Thế giới</label>
              <input id="chatInput" type="text" maxlength="120" placeholder="Truyền âm tới chư vị đạo hữu…">
              <button type="submit" id="chatSend">Gửi</button>
            </form>
            <div class="chat-hint"><span id="chatHint">Enter để gửi · 1 tin mỗi 3 giây</span><span id="chatCount">0/120</span></div>
          </div>
        </div>
      </div>
      <div class="strip-head">
        <b id="sRealm">Luyện Khí</b><span class="st" id="sStage">Tầng 1</span>
        <button class="ib sm" id="btnLogin" aria-label="Sự kiện" data-tip="Sự kiện" hidden><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/su_kien.png" alt=""></button>
        <button class="ib sm" id="btnRank" aria-label="Bảng xếp hạng" data-tip="Bảng xếp hạng&#10;Lực chiến và cảnh giới"><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/bang_xep_hang.png" alt=""></button>
        <button class="ib sm" id="btnMenu" aria-label="Cài đặt" data-tip="Cài đặt&#10;Bố cục, kích thước, ghim, ngôn ngữ"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <div class="qi">
        <div class="qi-head"><span id="qiLabel">Tu vi</span><span id="qiText">0 / 60</span></div>
        <div class="bar" id="qiBar"><i></i><span class="bar-txt" id="qiBarTxt"></span></div>
        <div class="buff-row" id="buffRow" hidden></div>
      </div>
      <div class="actions">
        <button class="ib" id="btnBag" aria-label="Hành trang" data-tip="Hành trang&#10;Trang bị, chỉ số và vật phẩm"><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/hanh_trang.png" alt=""></button>
        <button class="ib" id="btnPanel" aria-label="Bản đồ" data-tip="Bản đồ&#10;Chọn ải diệt yêu · khu vực Boss"><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/ban_do.png" alt=""></button>
        <button class="ib gold" id="btnAdvance" aria-label="Đột phá" data-tip="Đột phá"><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/dot_pha.png" alt=""></button>
        <button class="ib" id="btnLog" aria-label="Nhật ký tu hành" aria-controls="log" aria-expanded="false"><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/nhat_ky.png" alt=""></button>

        <button class="ib next" id="btnNext" aria-label="Ải tiếp theo" data-tip="Ải tiếp theo"><img class="mi action-art" src="img/ui/navigation-jade-gold-v1/ai_tiep.png" alt=""></button>
        <div class="trip walk" id="trip"><div class="trip-bar"><i></i></div><span id="tripText">Thám hiểm</span></div>
        <button class="ib sm speed2" id="btnSpeed2" hidden aria-pressed="false" data-tip="Thám hiểm ×2&#10;Gói Tốc Hành · bấm để bật / tắt">×2</button>
        <button class="ib boss" id="btnBoss" aria-label="Khiêu chiến Boss" data-tip="Khiêu chiến Boss" style="display:none"><svg class="bh" viewBox="0 0 24 24" aria-hidden="true">
          <defs><radialGradient id="bhHalo"><stop offset=".25" stop-color="#ff3a20" stop-opacity=".9"/><stop offset=".55" stop-color="#b0120a" stop-opacity=".45"/><stop offset="1" stop-color="#400" stop-opacity="0"/></radialGradient>
            <linearGradient id="bhArm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd09a"/><stop offset=".45" stop-color="#ff4a2a"/><stop offset="1" stop-color="#6a0800" stop-opacity="0"/></linearGradient></defs>
          <circle class="bh-halo" cx="12" cy="12" r="11.5" fill="url(#bhHalo)"/>
          <g class="bh-arms" fill="none" stroke="url(#bhArm)" stroke-linecap="round"><path d="M12 8.2c3.6-.4 6.6 1.8 7.4 5" stroke-width="1.6"/><path d="M15.8 12c.4 3.6-1.8 6.6-5 7.4" stroke-width="1.6"/><path d="M12 15.8c-3.6.4-6.6-1.8-7.4-5" stroke-width="1.6"/><path d="M8.2 12c-.4-3.6 1.8-6.6 5-7.4" stroke-width="1.6"/>
            <path d="M12 6.4c4.6.2 7.6 3.4 7.4 7.6" stroke-width=".7" opacity=".7"/><path d="M12 17.6c-4.6-.2-7.6-3.4-7.4-7.6" stroke-width=".7" opacity=".7"/></g>
          <ellipse class="bh-disk" cx="12" cy="12" rx="9" ry="2.4" fill="none" stroke="#ff7a3a" stroke-width=".9" opacity=".85" transform="rotate(-18 12 12)"/>
          <circle cx="12" cy="12" r="3.6" fill="#000" stroke="#ffb27a" stroke-width=".8"/>
          <circle cx="12" cy="12" r="2.6" fill="#000"/></svg></button>
      </div>
      <div class="tip" id="tip" role="tooltip" hidden></div>
      <div class="burst" id="burst" aria-live="assertive" hidden><b></b><small></small></div>
      <div class="craft-toast" id="craftToast" role="status" aria-live="polite" hidden></div>
    </section>

    <aside class="book">
      <div class="concept-header">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-g-tuluyen" aria-selected="true" data-group="tuluyen">Tu luyện</button>
        <button class="tab" role="tab" id="tab-inv" aria-selected="false" data-tab="inv">Hành trang</button>
        <button class="tab" role="tab" id="tab-craft" aria-selected="false" data-tab="craft">Luyện chế</button>
        <button class="tab" role="tab" id="tab-map" aria-selected="false" data-tab="map">Bản đồ</button>
        <button class="tab" role="tab" id="tab-pet" aria-selected="false" data-tab="pet">Linh thú</button>
        <button class="tab" role="tab" id="tab-market" aria-selected="false" data-tab="market">Chợ</button>
        <button class="tab adm" role="tab" id="tab-admin" aria-selected="false" data-tab="admin" hidden>Admin</button>
      </div>
      <button type="button" class="book-close" id="bookClose" aria-label="Đóng" title="Đóng (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="concept-tools" aria-label="Linh thạch hiện tại">
        <div class="subtabs" role="tablist" data-group="tuluyen" aria-label="Tu luyện">
          <button class="tab" role="tab" id="tab-req" aria-selected="true" data-tab="req">Đột phá</button>
          <button class="tab" role="tab" id="tab-skill" aria-selected="false" data-tab="skill">Công pháp</button>
          <button class="tab" role="tab" id="tab-kyduyen" aria-selected="false" data-tab="kyduyen">Kỳ duyên</button>
        </div>
        <div class="subtabs" role="tablist" data-group="pet" aria-label="Linh thú" hidden>
          <button class="tab" role="tab" aria-selected="false" data-pet-action="tab:stable">Chuồng thú</button>
          <button class="tab" role="tab" aria-selected="false" data-pet-action="tab:star">Ghép sao</button>
          <button class="tab" role="tab" aria-selected="false" data-pet-action="tab:train">Bồi dưỡng</button>
          <button class="tab" role="tab" aria-selected="false" data-pet-action="tab:hatch">Ấp trứng</button>
          <button class="tab" role="tab" aria-selected="false" data-pet-action="tab:codex">Thú điển</button>
        </div>
        <div class="subtabs" role="tablist" data-group="craft" aria-label="Luyện chế" hidden>
          <button class="tab" role="tab" aria-selected="false" data-lc="fuse">Luyện khí</button>
          <button class="tab" role="tab" aria-selected="false" data-lc="craft">Đan dược</button>
          <button class="tab" role="tab" aria-selected="false" data-lc="vault">Khảm Tinh Thạch</button>
          <button class="tab" role="tab" aria-selected="false" data-lc="sell">Bán</button>        </div>
        <div class="subtabs" role="tablist" data-group="market" aria-label="Phường thị" hidden>
          <button class="tab" role="tab" aria-selected="true" data-mk-view="vip">Tạp Hóa VIP</button>
          <button class="tab" role="tab" aria-selected="false" data-mk-view="shop">Tạp Hóa</button>
          <button class="tab" role="tab" aria-selected="false" data-mk-view="buy">Mua</button>
          <button class="tab" role="tab" aria-selected="false" data-mk-view="sell">Bán</button>
          <button class="tab" role="tab" aria-selected="false" data-mk-view="mine">Của tôi</button>
        </div>
        <div class="concept-wallet" title="Linh thạch hiện tại"><img src="img/stone/linh_thach.png" alt=""><span>Linh thạch</span><b class="concept-balance" id="navStones" aria-label="Linh thạch">—</b><button type="button" id="navMarket" aria-label="Mở Chợ" title="Mở Chợ">+</button></div>
        <div class="concept-wallet premium" title="Cực phẩm linh thạch hiện tại"><img src="img/stone/cuc_pham_linh_thach.png" alt=""><span>Cực phẩm</span><b class="concept-balance" id="navPremium" aria-label="Cực phẩm linh thạch">—</b></div>
      </div>
      <div class="pane" id="pane-req"></div>
      <div class="pane" id="pane-inv" hidden></div>
      <div class="pane" id="pane-vault" hidden></div>
      <div class="pane" id="pane-craft" hidden></div>
      <div class="pane" id="pane-fuse" hidden></div>
      <div class="pane" id="pane-petfuse" hidden></div>
      <div class="pane" id="pane-sell" hidden></div>
      <div class="pane" id="pane-spin" hidden></div>
      <div class="pane" id="pane-kyduyen" hidden></div>
      <div class="pane" id="pane-event" hidden></div>
      <div class="pane" id="pane-map" hidden></div>
      <div class="pane" id="pane-skill" hidden></div>
      <div class="pane" id="pane-pet" hidden></div>
      <div class="pane" id="pane-market" hidden></div>
      <div class="pane" id="pane-rank" hidden></div>
      <div class="pane" id="pane-admin" hidden></div>
    </aside>
  </main>

</div>

</body>
